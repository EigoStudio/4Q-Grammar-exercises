<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15章 to + 動詞の原形、動名詞</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  :root {
    --primary-orange: #ff9800;
    --primary-hover: #e65100;
    --text-brown: #5d4037;
    --bg-color: #fff8f0;
    --border-color: #d7ccc8;
  }

  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "HGMaruGothicMPRO", sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #333;
  }

  .top-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
  }

  .header-btn {
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    transition: background-color 0.2s;
  }
  .print-launch-btn { background-color: #795548; }
  .print-launch-btn:hover { background-color: #5d4037; }

  .container {
    background: white;
    max-width: 900px;
    width: 100%;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    min-height: 580px;
    margin-top: 40px;
  }

  h2 {
    color: #e65100;
    text-align: center;
    margin-bottom: 20px;
  }

  /* タブUIのスタイル */
  .tab-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 10px 18px;
    border: 2px solid var(--primary-orange);
    background-color: white;
    color: var(--text-brown);
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
    font-family: inherit;
  }

  .tab-btn:hover {
    background-color: #fff3e0;
  }

  .tab-btn.active {
    background-color: var(--primary-orange);
    color: white;
  }

  .progress-container {
    width: 100%;
    background-color: #eee;
    border-radius: 10px;
    margin-bottom: 10px;
    height: 8px;
  }
  .progress-bar {
    height: 100%;
    background-color: var(--primary-orange);
    width: 0%;
    transition: width 0.3s;
  }

  .progress-text {
    text-align: right;
    font-size: 0.9rem;
    color: var(--text-brown);
    font-weight: bold;
    margin-bottom: 20px;
  }

  .question-box {
    font-size: 1.3rem;
    line-height: 1.8;
    margin-bottom: 30px;
    text-align: left;
    min-height: 90px;
    font-family: inherit;
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
  }

  .choice-card-btn {
    padding: 15px 10px;
    border: 2px solid var(--border-color);
    background: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.1rem;
    text-align: center;
    color: var(--text-brown);
    transition: all 0.2s;
    font-family: inherit;
    font-weight: bold;
  }

  .choice-card-btn:hover {
    border-color: var(--primary-orange);
    background-color: #fffaf0;
  }

  .choice-card-btn.selected {
    border-color: var(--primary-orange);
    background-color: #fff3e0;
  }

  /* ◯/❌専用ボタンのデザイン */
  .ox-grid {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 25px;
  }

  .ox-btn {
    width: 120px;
    height: 90px;
    font-size: 2.5rem;
    font-weight: bold;
    border: 3px solid var(--border-color);
    background: white;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-brown);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .ox-btn:hover {
    border-color: var(--primary-orange);
    background-color: #fffaf0;
  }

  .ox-btn.selected {
    border-color: var(--primary-orange);
    background-color: #fff3e0;
  }

  /* 直感的理由選択（3択） */
  .reason-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .reason-card-btn {
    padding: 18px 10px;
    border: 2px solid var(--border-color);
    background: white;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1.1rem;
    text-align: center;
    color: var(--text-brown);
    transition: all 0.2s;
    font-family: inherit;
    font-weight: bold;
  }

  .reason-card-btn:hover {
    border-color: var(--primary-orange);
    background-color: #fffaf0;
  }

  .reason-card-btn.selected {
    border-color: var(--primary-orange);
    background-color: #fff3e0;
  }

  .word-btn {
    background-color: white;
    color: var(--text-brown);
    border: 2px solid var(--primary-orange);
    padding: 10px 18px;
    border-radius: 25px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    margin: 5px;
    display: inline-block;
    font-family: inherit;
  }

  .word-btn.used {
    border-color: #eee;
    color: #ccc;
    pointer-events: none;
  }

  .correct-word {
    color: #e74c3c;
    font-weight: bold;
    text-decoration: underline;
    margin: 0 5px;
  }

  .answer-area {
    min-height: 75px;
    border-bottom: 2px solid #ffcc80;
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background-color: #fffafb;
    border-radius: 10px;
  }

  .celebration-text {
    font-size: 2rem;
    color: #2e7d32;
    font-weight: bold;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    line-height: 1.6;
    padding: 20px 0;
  }

  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .action-btn {
    padding: 16px 45px;
    font-size: 1.2rem;
    background-color: #43a047;
    color: white;
    border: none;
    border-radius: 35px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 0 #2e7d32;
    display: block;
    margin: 20px auto;
    font-family: inherit;
  }

  #printable-sheet { display: none; }

  @media (max-width: 600px) {
    .container { padding: 20px; }
    .question-box { font-size: 1.1rem; line-height: 1.6; }
    .choice-grid { grid-template-columns: 1fr; }
    .reason-grid { grid-template-columns: 1fr; }
    .choice-card-btn { padding: 15px; font-size: 1rem; text-align: left; }
    .word-btn { font-size: 1rem; padding: 8px 12px; margin: 3px; }
    .celebration-text { font-size: 1.4rem; }
    .ox-btn { width: 90px; height: 70px; font-size: 2rem; }
  }

  /* --- 印刷用スタイルの完全最適化 --- */
  @media print {
    @page {
      size: A4 portrait;
      margin: 12mm 10mm;
    }

    html, body {
      background-color: white !important;
      color: black !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: auto !important;
      overflow: visible !important;
    }

    .container, h2, .top-controls, .tab-container {
      display: none !important;
    }

    #printable-sheet {
      display: block !important;
      position: relative !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "HGMaruGothicMPRO", sans-serif !important;
    }

    .sheet-header {
      text-align: center;
      border-bottom: 2px solid #000;
      margin-bottom: 15px;
      padding-bottom: 5px;
    }

    .sheet-title {
      font-size: 15pt;
      font-weight: bold;
      margin: 0 0 5px 0;
    }

    .section-title {
      font-size: 11pt;
      font-weight: bold;
      margin: 15px 0 10px 0;
      background-color: #f0f0f0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      padding: 5px 8px;
      border-left: 4px solid #333;
    }

    .sheet-question {
      margin-bottom: 14px;
      page-break-inside: avoid;
    }

    .q-text {
      font-size: 10pt;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .q-line {
      border-bottom: 1px dashed #666;
      height: 24px;
      width: 98%;
      margin-bottom: 4px;
    }

    .word-hint {
      font-size: 9pt;
      color: #333;
      padding-left: 10px;
    }

    .answer-key-section {
      page-break-before: always;
      margin-top: 20px;
      border-top: 2px dashed #000;
      padding-top: 15px;
      font-size: 9.5pt;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .key-item {
      margin-bottom: 4px;
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>

<div class="top-controls">
  <button class="header-btn print-launch-btn" onclick="triggerPrint()">🖨️ プリントを作成</button>
</div>

<h2>15章  to + 動詞の原形、動名詞</h2>

<div class="container">
  <!-- タブ領域 -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="switchSection('adverbial')">1. 不定詞の副詞的用法</button>
    <button class="tab-btn" onclick="switchSection('adjective')">2. 不定詞の形容詞的用法</button>
    <button class="tab-btn" onclick="switchSection('noun_gerund')">3. 不定詞の名詞的用法 & 動名詞</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 0問目</div>

  <div id="game-content">
    <div class="question-box" id="qText"></div>
    <div id="ui-area"></div>
    <div id="feedback-area" style="text-align:center; min-height: 40px;"></div>
    <button class="action-btn" id="checkBtn" style="display:none;" onclick="handleCheck()">答えをチェック</button>
    <button class="action-btn" id="nextBtn" style="display:none; background-color: #ef6c00; box-shadow: 0 4px 0 #b33f00;" onclick="nextQuestion()">次の問題へ</button>
  </div>
</div>

<div id="printable-sheet">
  <div class="sheet-header">
    <h1 class="sheet-title">15章 { to + 動詞の原形、動名詞 } 演習プリント</h1>
  </div>
  <div id="sheet-content"></div>
  <div class="answer-key-section">
    <h3>【Answer Key / 解答】</h3>
    <div id="sheet-answers" class="key-grid"></div>
  </div>
</div>

<script>
  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

      { type: "sort", section: "adverbial", ja: "彼らは先生に質問をするために教室に残りました。", en_full: "They stayed in the classroom to ask their teacher a question.", words: ["They", "stayed", "in", "the", "classroom", "to", "ask", "their", "teacher", "a", "question."] },

      { type: "sort", section: "adverbial", ja: "彼は夕食を買うためにスーパーへ行った。", en_full: "He went to the supermarket to buy dinner.", words: ["He", "went", "to", "the", "supermarket", "to", "buy", "dinner."] },

      {

      {
        type: "choice", section: "noun_gerund",
        base: "My brother likes <span id='blank'>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</span> his bike in the park.",
        print_base: "My brother likes ( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ) his bike in the park.",
        choices: ["riding", "ride", "rode", "to riding"],
        ans: "riding",
        ja: "私の兄（弟）は公園で自転車に乗るのが好きです。"
      }
    ]
  };

  let currentSection = 'adverbial';
  let currentQuizList = [];
  let currentIdx = 0;

  // 状態管理変数
  let selectedChoice = null;
  let userSort = [];
  let errorStep = 1;
  let selectedOX = null;
  let selectedReasonIdx = null;

  function switchSection(secKey) {
    currentSection = secKey;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    if(window.event && window.event.target) {
      window.event.target.classList.add('active');
    }
    
    currentQuizList = allQuizData[secKey];
    currentIdx = 0;
    loadQuestion();
  }

  function loadQuestion() {
    const q = currentQuizList[currentIdx];
    const ui = document.getElementById('ui-area');
    const qText = document.getElementById('qText');
    const feedback = document.getElementById('feedback-area');
    
    document.getElementById('progressBar').style.width = `${((currentIdx) / currentQuizList.length) * 100}%`;
    document.getElementById('progressText').textContent = `${currentIdx + 1} / ${currentQuizList.length} 問目`;
    
    document.getElementById('nextBtn').style.display = "none";
    document.getElementById('checkBtn').style.display = "none";
    feedback.innerHTML = "";
    ui.innerHTML = "";
    
    selectedChoice = null;
    selectedOX = null;
    selectedReasonIdx = null;
    errorStep = 1;

    if (q.type === "choice") {
      qText.innerHTML = `<div style="color:#ef6c00; font-size:1rem; margin-bottom:8px; font-weight:bold;">【選択問題】カッコに入る正しい形を選ぼう！<br><span style="color:#5d4037; font-weight:normal;">（${q.ja}）</span></div>` + q.base;
      const grid = document.createElement('div');
      grid.className = 'choice-grid';
      const shuffledChoices = shuffle([...q.choices]);
      shuffledChoices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice-card-btn';
        btn.textContent = c;
        btn.onclick = () => {
          document.querySelectorAll('.choice-card-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedChoice = c;
          document.getElementById('checkBtn').style.display = "block";
        };
        grid.appendChild(btn);
      });
      ui.appendChild(grid);
    } else if (q.type === "error") {
      renderErrorStep1();
    } else {
      qText.innerHTML = `<div style="color:#e65100; font-size:1.1rem; margin-bottom:12px; font-weight:bold;">【並べ替え問題】正しい順番に並べ替えよう！</div><div style="color:#5d4037; font-weight:bold;">日本語：${q.ja}</div>`;
      const area = document.createElement('div');
      area.className = 'answer-area';
      area.id = 'answerArea';
      area.innerHTML = '<span style="color:#aaa;">下のパーツをタップして並べ替えてね</span>';
      
      const bank = document.createElement('div');
      bank.style.textAlign = "center";
      
      userSort = [];
      const shuffledWords = shuffle([...q.words]);
      shuffledWords.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'word-btn';
        btn.textContent = w;
        btn.onclick = () => {
          if (btn.classList.contains('used')) return;
          if (userSort.length === 0) area.innerHTML = "";
          userSort.push({ text: w, btn: btn });
          btn.classList.add('used');
          renderSort();
        };
        bank.appendChild(btn);
      });
      ui.appendChild(area);
      ui.appendChild(bank);
    }
  }

  function renderErrorStep1() {
    const q = currentQuizList[currentIdx];
    const qText = document.getElementById('qText');
    const ui = document.getElementById('ui-area');
    
    qText.innerHTML = `
      <div style="color:#e65100; font-size:1rem; margin-bottom:5px; font-weight:bold;">【間違い探し】この英文は正しい？それともまちがい？</div>
      <div style="font-size: 1.2rem; color:#5d4037; font-weight:bold; margin-bottom:5px;">${q.sentence}</div>
      <div style="font-size: 0.95rem; color:#666;">（${q.ja}）</div>
    `;
    
    ui.innerHTML = "";
    const oxDiv = document.createElement('div');
    oxDiv.className = 'ox-grid';

    const btnO = document.createElement('button');
    btnO.className = 'ox-btn';
    btnO.textContent = '◯';
    btnO.onclick = () => {
      document.querySelectorAll('.ox-btn').forEach(b => b.classList.remove('selected'));
      btnO.classList.add('selected');
      selectedOX = true;
      document.getElementById('checkBtn').style.display = "block";
    };

    const btnX = document.createElement('button');
    btnX.className = 'ox-btn';
    btnX.textContent = '❌';
    btnX.onclick = () => {
      document.querySelectorAll('.ox-btn').forEach(b => b.classList.remove('selected'));
      btnX.classList.add('selected');
      selectedOX = false;
      document.getElementById('checkBtn').style.display = "block";
    };

    oxDiv.appendChild(btnO);
    oxDiv.appendChild(btnX);
    ui.appendChild(oxDiv);
  }

  function renderErrorStep2() {
    errorStep = 2;
    const q = currentQuizList[currentIdx];
    const qText = document.getElementById('qText');
    const ui = document.getElementById('ui-area');
    document.getElementById('checkBtn').style.display = "none";

    qText.innerHTML = `
      <div style="color:#d32f2f; font-size:1rem; margin-bottom:5px; font-weight:bold;">【間違い探し】どこをどう直せばいいかな？</div>
      <div style="font-size: 1.2rem; color:#5d4037; font-weight:bold; margin-bottom:15px;">${q.sentence}</div>
    `;

    ui.innerHTML = "";
    const reasonDiv = document.createElement('div');
    reasonDiv.className = 'reason-grid';

    let indexedReasons = q.reasons.map((r, i) => ({ text: r, originalIndex: i }));
    let shuffledReasons = shuffle([...indexedReasons]);

    shuffledReasons.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'reason-card-btn';
      btn.textContent = item.text;
      btn.onclick = () => {
        document.querySelectorAll('.reason-card-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedReasonIdx = item.originalIndex;
        document.getElementById('checkBtn').style.display = "block";
      };
      reasonDiv.appendChild(btn);
    });

    ui.appendChild(reasonDiv);
  }

  function renderSort() {
    const area = document.getElementById('answerArea');
    area.innerHTML = "";
    userSort.forEach((item, idx) => {
      const b = document.createElement('button');
      b.className = 'word-btn';
      b.style.margin = "2px";
      b.textContent = item.text;
      b.onclick = () => {
        item.btn.classList.remove('used');
        userSort.splice(idx, 1);
        renderSort();
        if(userSort.length === 0) area.innerHTML = '<span style="color:#aaa;">下のパーツをタップして並べ替えてね</span>';
      };
      area.appendChild(b);
    });
    
    if (userSort.length === currentQuizList[currentIdx].words.length) {
      document.getElementById('checkBtn').style.display = "block";
    } else {
      document.getElementById('checkBtn').style.display = "none";
    }
  }

  function handleCheck() {
    const q = currentQuizList[currentIdx];

    if (q.type === "choice") {
      if (selectedChoice === q.ans) {
        if(document.getElementById('blank')) {
          document.getElementById('blank').innerHTML = `<span class="correct-word">${q.ans}</span>`;
        }
        showSuccess();
      } else {
        alert("もう一度よく考えてみよう！");
      }
    } else if (q.type === "error") {
      if (errorStep === 1) {
        if (selectedOX === q.isCorrect) {
          if (q.isCorrect === false) {
            renderErrorStep2();
          } else {
            showSuccess();
          }
        } else {
          alert("ざんねん！ もう一度文をよく見てみよう。");
        }
      } else if (errorStep === 2) {
        if (selectedReasonIdx === q.correctReasonIdx) {
          document.getElementById('ui-area').innerHTML = `
            <div class="celebration-text">
              ✨ 大正解！ ✨<br>
              <span style="font-size:1.2rem; color:#333; font-weight:normal;">正しい文：<b>${q.correctSentence}</b></span>
            </div>
          `;
          showSuccess();
        } else {
          alert("どこを直すか、もう一度考えてみよう！");
        }
      }
    } else {
      let userStr = userSort.map(i => i.text).join(" ");
      let cleanUser = userStr.replace(/[\.,\?]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
      let cleanAns = q.en_full.replace(/[\.,\?]/g, "").toLowerCase().replace(/\s+/g, " ").trim();

      if (cleanUser === cleanAns) {
        document.getElementById('ui-area').innerHTML = `<div class="celebration-text">✨ 大正解！ ✨<br><span style="font-size:1.3rem; color:#333;">${q.en_full}</span></div>`;
        showSuccess();
      } else {
        alert("語順を確認してね！");
      }
    }
  }

  function showSuccess() {
    document.getElementById('checkBtn').style.display = "none";
    document.getElementById('nextBtn').style.display = "block";
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < currentQuizList.length) {
      loadQuestion();
    } else {
      document.getElementById('game-content').innerHTML = "<div class='celebration-text'>🎉 このセクションをクリア！素晴らしい！ 🎉</div>";
      document.getElementById('progressBar').style.width = "100%";
      document.getElementById('progressText').textContent = `${currentQuizList.length} / ${currentQuizList.length} 問目`;
    }
  }

  // 印刷用プリントの生成処理
  function generatePrintSheet() {
    const contentDiv = document.getElementById('sheet-content');
    const answerDiv = document.getElementById('sheet-answers');
    
    contentDiv.innerHTML = "";
    answerDiv.innerHTML = "";

    const sectionsInfo = [
      { key: "adverbial", name: "【第1部】不定詞の副詞的用法（〜するために）" },
      { key: "adjective", name: "【第2部】不定詞の形容詞的用法（〜するための／〜するべき）" },
      { key: "noun_gerund", name: "【第3部】不定詞の名詞的用法 & 動名詞（〜すること）" }
    ];

    sectionsInfo.forEach((sec) => {
      const secTitle = document.createElement('div');
      secTitle.className = 'section-title';
      secTitle.textContent = sec.name;
      contentDiv.appendChild(secTitle);

      const items = allQuizData[sec.key];

      items.forEach((item, index) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'sheet-question';

        if (item.type === "sort") {
          let shuffledWords = shuffle([...item.words]);
          qBlock.innerHTML = `
            <div class="q-text">${index + 1}. [並べ替え] ${item.ja}</div>
            <div class="q-line"></div>
            <div class="word-hint">語群：[ &nbsp;${shuffledWords.join(' &nbsp; / &nbsp; ')}&nbsp; ]</div>
          `;
          const aBlock = document.createElement('div');
          aBlock.className = 'key-item';
          aBlock.innerHTML = `<b>${sec.name.slice(0, 5)} (${index + 1})</b> ${item.en_full}`;
          answerDiv.appendChild(aBlock);

        } else if (item.type === "error") {
          qBlock.innerHTML = `
            <div class="q-text">${index + 1}. [間違い探し] 次の英文が正しければ◯、間違っていれば❌を書き、❌の場合は正しい文にしなさい。</div>
            <div class="q-text" style="padding-left:15px;">( &nbsp;&nbsp;&nbsp;&nbsp; ) ${item.sentence}</div>
            <div class="q-line"></div>
          `;
          const aBlock = document.createElement('div');
          aBlock.className = 'key-item';
          let correctStr = item.isCorrect ? "◯ (正しい文)" : `❌ → ${item.correctSentence}`;
          aBlock.innerHTML = `<b>${sec.name.slice(0, 5)} (${index + 1})</b> ${correctStr}`;
          answerDiv.appendChild(aBlock);

        } else if (item.type === "choice") {
          let printChoices = shuffle([...item.choices]);
          qBlock.innerHTML = `
            <div class="q-text">${index + 1}. [穴埋め選択] ${item.ja}</div>
            <div style="font-size:10.5pt; margin: 3px 0 3px 15px;">${item.print_base}</div>
            <div class="word-hint">選択肢：[ ${printChoices.join(' &nbsp;/ &nbsp;')} ]</div>
          `;
          const aBlock = document.createElement('div');
          aBlock.className = 'key-item';
          aBlock.innerHTML = `<b>${sec.name.slice(0, 5)} (${index + 1})</b> ${item.ans}`;
          answerDiv.appendChild(aBlock);
        }

        contentDiv.appendChild(qBlock);
      });
    });
  }

  // 印刷ボタン実行用の関数（確実に要素を準備してからダイアログを起動）
  function triggerPrint() {
    generatePrintSheet();
    setTimeout(() => {
      window.print();
    }, 100);
  }

  window.onload = function() {
    currentQuizList = allQuizData[currentSection];
    loadQuestion();
    generatePrintSheet();
  };
</script>
</body>
</html>
